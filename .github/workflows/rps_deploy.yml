name: 更新 RPS 看板

on:
  schedule:
    # 每天 UTC 8:00 ≈ 北京时间 16:00（A股15:00收盘后1小时，数据已完整）
    - cron: '0 8 * * 1-5'
  # 也可以手动触发
  workflow_dispatch:
  # 推送到 main 时触发（调试用）
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 计算 RPS
        run: |
          mkdir -p static
          # 从上次部署的 gh-pages 分支下载上次名单，用于对比调入/调出/在榜
          curl -sf "https://raw.githubusercontent.com/huse11/rps-board/gh-pages/static/last_result.json" -o static/last_result.json && echo "✅ 已获取上次名单" || echo "ℹ️ 首次运行，无历史名单"
          python rps_calc.py

      - name: 清理缓存文件（只在gh-pages保留看板必需的文件）
        run: |
          rm -rf static/daily_cache static/rps_history.json __pycache__ .github
          rm -f rps_calc.py web_server.py requirements.txt .gitignore

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
