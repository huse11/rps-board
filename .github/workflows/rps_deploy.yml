name: 更新 RPS 看板

on:
  schedule:
    # 多重保险：GitHub 的 schedule 触发不可靠（高负载时会跳过/延迟，实测延迟过7小时甚至不触发）
    # 多设几个时间点，任意一个触发即可；rps_calc.py 幂等保证同一天只真正计算一次
    - cron: '10 10 * * 1-5'   # 北京时间 18:10
    - cron: '10 11 * * 1-5'   # 北京时间 19:10
    - cron: '10 12 * * 1-5'   # 北京时间 20:10
  # 也可以手动触发
  workflow_dispatch:
  # 推送到 main 时触发（调试用）
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 串行锁：同一时间只允许一个run执行，防止多个cron/push并发部署到gh-pages产生冲突
    concurrency:
      group: rps-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 计算 RPS
        run: |
          mkdir -p static
          # 从上次部署的 gh-pages 分支下载上次名单，用于对比调入/调出/在榜
          curl -sf "https://raw.githubusercontent.com/huse11/rps-board/gh-pages/static/last_result.json" -o static/last_result.json && echo "✅ 已获取上次名单" || echo "ℹ️ 首次运行，无历史名单"
          # 下载当前数据文件，供幂等判断（当天已更新则跳过计算，保护last_result对比基准）
          curl -sf "https://raw.githubusercontent.com/huse11/rps-board/gh-pages/static/rps_data.json" -o static/rps_data.json && echo "✅ 已获取当前数据" || echo "ℹ️ 首次运行，无现有数据"
          # 兜底: 下载上次 recommendations.json, 防止本次推荐生成失败(Tushare 限频等)时
          # 部署后 gh-pages 丢失该文件导致手机 404。rps_calc.py 成功生成会覆盖它。
          curl -sf "https://raw.githubusercontent.com/huse11/rps-board/gh-pages/static/recommendations.json" -o static/recommendations.json && echo "✅ 已获取上次推荐(兜底)" || echo "ℹ️ 首次运行，无历史推荐"
          # 兜底: 下载上周 weekly_recommendations.json (周度推荐每周五生成1次, 其余天复用上周结果)
          curl -sf "https://raw.githubusercontent.com/huse11/rps-board/gh-pages/static/weekly_recommendations.json" -o static/weekly_recommendations.json && echo "✅ 已获取上周周度推荐(兜底)" || echo "ℹ️ 首次运行，无历史周度推荐"
          # 每天只计算一次：幂等检查（rps_calc.py）保证当天已生成数据时不重复刷新，避免覆盖调入/调出对比基准
          python rps_calc.py
          # 推荐生成失败(不阻断)时, 兜底文件仍在; 若连兜底都没有则告警
          if [ ! -f static/recommendations.json ]; then echo "❌ recommendations.json 缺失(无历史兜底+本次生成失败)"; exit 1; fi

      - name: 数据新鲜度检查（数据过期即失败，触发通知）
        run: |
          python - <<'EOF'
          import json, sys
          try:
              data = json.load(open('static/rps_data.json'))
          except Exception as e:
              print(f"❌ 未生成数据文件: {e}")
              sys.exit(1)
          ud = str(data.get('update_date', ''))
          ex = str(data.get('expected_trade_date', ''))
          if not ud or (ex and ud < ex):
              print(f"❌ 数据过期: update_date={ud}, 预期交易日={ex}")
              sys.exit(1)
          print(f"✅ 数据新鲜: update_date={ud}")
          EOF

      - name: 单元测试（防止四列数据为空等回归）
        run: |
          python -m unittest discover -s tests -v

      - name: 前端渲染测试（弹窗18列/四列渲染回归）
        run: |
          node --test tests/test_render.js

      - name: 清理缓存文件（只在gh-pages保留看板必需的文件）
        run: |
          rm -rf static/daily_cache static/rps_history.json static/index_cache __pycache__ .github tests
          rm -f rps_calc.py recommend.py recommend_weekly.py web_server.py requirements.txt .gitignore
          rm -f static/fina_indicator_cache.json static/moneyflow_cache.json static/moneyflow_hsgt_cache.json

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

      - name: 失败通知（Server酱微信推送）
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          KEY="${{ secrets.SERVERCHAN_SENDKEY }}"
          if [ -z "$KEY" ]; then
            echo "⚠️ 未配置 SERVERCHAN_SENDKEY，跳过微信通知（在仓库 Settings→Secrets and variables→Actions 添加）"
            exit 0
          fi
          curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=RPS看板更新失败" \
            --data-urlencode "desp=定时更新失败或数据过期，请到 https://github.com/huse11/rps-board/actions 查看日志。时间：$(date '+%m-%d %H:%M')" || true
